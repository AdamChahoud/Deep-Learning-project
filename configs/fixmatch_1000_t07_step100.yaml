seed: 0

data:
  root: data
  val_size: 5000
  num_labeled: 1000
  num_classes: 10

model:
  name: small_cnn
  num_classes: 10

training:
  epochs: 20
  steps_per_epoch: 100
  batch_labeled: 64
  batch_unlabeled: 128
  lr: 0.001
  weight_decay: 0.0005
  num_workers: 0

fixmatch:
  threshold: 0.70
  lambda_u: 1.0

output:
  dir: outputs